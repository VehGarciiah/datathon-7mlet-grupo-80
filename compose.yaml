name: datathon-observability

services:
  api:
    image: localhost/datathon-api:1.0.0
    build:
      context: .
      dockerfile: Containerfile
      target: api
    environment:
      DATATHON_POLICY_MODE: ${DATATHON_POLICY_MODE:-approved}
      DATATHON_LOG_FILE: /var/log/datathon/api.jsonl
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local-compose}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./runtime/serving:/app/artifacts/serving
      - ./runtime/logs:/var/log/datathon
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      otel-collector:
        condition: service_started
    restart: unless-stopped
    networks:
      - observability

  process-exporter:
    image: localhost/datathon-api:1.0.0
    build:
      context: .
      dockerfile: Containerfile
      target: api
    command: ["python", "-m", "src.observability.process_exporter"]
    environment:
      DATATHON_PROJECT_ROOT: /workspace
      DATATHON_PROCESS_EXPORTER_PORT: "9101"
    volumes:
      - ./artifacts:/workspace/artifacts:ro
      - ./configs:/workspace/configs:ro
      - ./data/interim:/workspace/data/interim:ro
      - ./data/processed:/workspace/data/processed:ro
      - ./reports:/workspace/reports:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - observability

  mlflow:
    image: localhost/datathon-mlflow:3.15.1
    build:
      context: .
      dockerfile: Containerfile
      target: mlflow
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "localhost,127.0.0.1,mlflow"
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - observability

  prometheus:
    image: docker.io/prom/prometheus:v3.12.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
      - process-exporter
      - alertmanager
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - observability

  alertmanager:
    image: docker.io/prom/alertmanager:v0.32.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - observability

  loki:
    image: docker.io/grafana/loki:3.7.2
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - observability

  alloy:
    image: docker.io/grafana/alloy:v1.18.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./runtime/logs:/var/log/datathon:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - api
      - loki
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - observability

  tempo:
    image: docker.io/grafana/tempo:2.10.5
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - observability

  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.158.0
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./observability/otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on:
      - tempo
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - observability

  grafana:
    image: docker.io/grafana/grafana:13.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-datathon-local}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - observability

networks:
  observability:
    name: datathon-observability

volumes:
  alertmanager-data:
  alloy-data:
  grafana-data:
  loki-data:
  mlflow-data:
  prometheus-data:
  tempo-data:
