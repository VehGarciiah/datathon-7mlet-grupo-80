name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Validar lint
        run: python -m ruff check .

      - name: Executar testes
        run: python -m pytest -q

      - name: Verificar hash do snapshot bruto
        run: python -m src.data.translate --config configs/data.yaml
